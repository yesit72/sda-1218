<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#03140C;overflow:hidden}
body{--gline:#DDBB62;--g1:#B18A2B;--g2:#F1D98A;--g3:#FFF7D6;--ink:#F6EED8;--muted:#BCCABA;--ruby:#B8142C;
  color:var(--ink);font-family:'Noto Serif KR',serif;-webkit-font-smoothing:antialiased;word-break:keep-all}
.bg{position:fixed;inset:0;background:radial-gradient(120% 75% at 50% 0%,#17604A 0%,#0B3426 45%,#04190F 80%,#020D07 100%)}
canvas{position:fixed;left:0;top:0;width:100%;height:var(--vh,100%);pointer-events:none;z-index:25}
.gold{background:linear-gradient(105deg,var(--g1) 0%,var(--g2) 22%,var(--g3) 34%,var(--g2) 46%,var(--g1) 60%,var(--g2) 78%,var(--g1) 100%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;animation:shine 7s linear infinite}
@keyframes shine{0%{background-position:100% 0}100%{background-position:-150% 0}}
.cap{font:600 11px/1.5 'Cormorant Garamond',serif;letter-spacing:.42em;text-transform:uppercase;color:var(--gline);padding-left:.42em}
.script{font-family:'Pinyon Script',cursive;font-weight:400;line-height:1.05}

/* intro */
.intro{position:fixed;inset:0;z-index:20;background:radial-gradient(120% 75% at 50% 0%,#17604A 0%,#0B3426 45%,#04190F 80%,#020D07 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;cursor:pointer;transition:opacity 1.4s ease,visibility 1.4s}
.intro.gone{opacity:0;visibility:hidden}
.intro .script{font-size:44px}
.orn{width:118px;height:118px;filter:drop-shadow(0 0 18px rgba(241,217,138,.45));animation:float 4s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.tap{display:flex;flex-direction:column;align-items:center;gap:12px;font:600 12px/1 'Cormorant Garamond',serif;letter-spacing:.34em;color:#EADFBF;padding-left:.34em}
.tap span{animation:pulse 1.9s ease-in-out infinite}
.tap svg{width:34px;height:34px;margin-left:-.34em;filter:drop-shadow(0 0 6px rgba(241,217,138,.5));animation:tapf 1.9s ease-in-out infinite;transform-origin:50% 80%}
@keyframes tapf{0%,100%{transform:translateY(0) scale(1)}45%{transform:translateY(5px) scale(.92)}60%{transform:translateY(5px) scale(.92)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

/* card */
.stage{position:fixed;left:0;right:0;top:0;height:0;z-index:5}
.card{position:absolute;left:50%;top:0;width:440px;height:640px;margin-left:-220px;transform-origin:50% 0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:104px 30px 40px}
.frame{position:absolute;inset:0;border:1px solid rgba(221,187,98,.7)}
.frame:after{content:"";position:absolute;inset:7px;border:1px solid rgba(221,187,98,.32)}
.corner{position:absolute;width:46px;height:46px}
.deco{position:absolute;left:0;top:-6px;width:440px;height:110px;overflow:visible;z-index:2}
.deco2{position:absolute;left:0;top:0;width:440px;height:640px;pointer-events:none}
.tw{animation:tw 2.2s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:1}50%{opacity:.25}}
.sw{transform-box:view-box;animation:sw 4.6s ease-in-out infinite}
@keyframes sw{0%,100%{transform:rotate(5deg)}50%{transform:rotate(-5deg)}}
.spk{transform-box:view-box;animation:spk 2.6s ease-in-out infinite}
@keyframes spk{0%,100%{transform:scale(.35);opacity:.2}50%{transform:scale(1.15);opacity:1}}
@keyframes swing{0%,100%{transform:rotate(4deg)}50%{transform:rotate(-4deg)}}
.rise{opacity:0;transform:translateY(16px);transition:opacity 1.6s ease,transform 1.6s ease}
.on .rise{opacity:1;transform:none}
.on .d1{transition-delay:.3s}.on .d2{transition-delay:.9s}.on .d3{transition-delay:1.5s}.on .d4{transition-delay:2.1s}.on .d5{transition-delay:2.7s}.on .d6{transition-delay:3.3s}.on .d7{transition-delay:3.9s}
.mc{font-size:64px}
.amp{font:italic 500 26px/1 'Playfair Display',serif;color:var(--gline);margin:6px 0 2px}
.hny{font-size:50px}
.yr{font:600 30px/1 'Playfair Display',serif;letter-spacing:.32em;padding-left:.32em;margin-top:14px;font-variant-numeric:lining-nums}
.rule{display:flex;align-items:center;gap:12px;width:200px;margin:18px 0 16px}
.rule i{flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--gline))}
.rule i:last-child{background:linear-gradient(270deg,transparent,var(--gline))}
.rule b{width:7px;height:7px;background:var(--gline);transform:rotate(45deg);display:block}
.msg{font:400 17px/1.8 'Noto Serif KR',serif;color:rgba(246,238,216,.92)}
.sign{margin-top:18px;font:600 17px/1 'Noto Serif KR',serif;letter-spacing:.12em}
.note{position:absolute;left:0;right:0;bottom:20px;font:400 11.5px/1.6 'Noto Serif KR',serif;color:rgba(188,202,186,.75)}
.mute{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);right:12px;z-index:30;width:40px;height:40px;border-radius:50%;border:1px solid rgba(221,187,98,.6);background:rgba(4,25,15,.55);color:var(--g2);display:none;align-items:center;justify-content:center;cursor:pointer;backdrop-filter:blur(4px)}
.mute.show{display:flex}
.spd{position:fixed;top:calc(env(safe-area-inset-top,0px) + 12px);left:12px;z-index:30;display:none;align-items:center;gap:10px;height:40px;padding:0 14px 0 12px;border-radius:20px;border:1px solid rgba(221,187,98,.6);background:rgba(4,25,15,.55);backdrop-filter:blur(4px)}
.spd.show{display:flex}
.spd svg{width:16px;height:16px;flex:none}
.spd b{font:600 13px/1 'Playfair Display',serif;color:#F1D98A;min-width:8px;text-align:center}
.spd input{-webkit-appearance:none;appearance:none;width:104px;height:2px;margin:0;background:linear-gradient(90deg,#B18A2B,#F1D98A,#FFF7D6);border-radius:2px;outline:none}
.spd input::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:#FFF7D6;border:1px solid #B18A2B;box-shadow:0 0 8px rgba(241,217,138,.6);cursor:pointer}
.spd input::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:#FFF7D6;border:1px solid #B18A2B;cursor:pointer}
.mute svg{width:18px;height:18px}
.cameo{position:fixed;right:0;bottom:-4px;z-index:24;width:84px;transform:translateY(110%);transition:transform 1.8s cubic-bezier(.2,.9,.25,1.15),bottom .4s linear;pointer-events:auto;cursor:pointer;-webkit-tap-highlight-color:transparent}
.cameo.hop svg{animation:hop .45s ease-out}
@keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-14px)}}
.cameo.up{transform:translateY(0)}
.cameo .bob{animation:bob 3.2s ease-in-out infinite;transform-origin:50% 100%}
.cameo .bob2{animation:bob 3.2s ease-in-out .5s infinite;transform-origin:50% 100%}
.cameo .bob3{animation:bob 3.2s ease-in-out 1s infinite;transform-origin:50% 100%}
@keyframes bob{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(2deg)}}
.cameo .wave{animation:wave 1.1s ease-in-out infinite;transform-origin:0 0}
@keyframes wave{0%,100%{transform:rotate(-10deg)}50%{transform:rotate(-55deg)}}
.tree{position:fixed;left:2px;bottom:-4px;z-index:24;width:86px;transform:translateY(115%);transition:transform 1.8s cubic-bezier(.2,.9,.25,1.15) .4s,bottom .4s linear;pointer-events:none}
.tree.up{transform:translateY(0)}
@media (max-height:720px){.cameo{width:72px}.tree{width:72px}}
@media (min-width:700px){.cameo{width:110px;right:0}.tree{width:112px}}
</style>
</head>

<script>
/* ---------- twinkling lights & sparkles (generated) ---------- */
(function(){const NS='http://www.w3.org/2000/svg',LC=['#FFD772','#FF5A6E','#7FE0A8','#FFF6D8','#FFB347'];
  function bulb(x,y,r,c,d,f){return '<g class="tw" style="animation-delay:'+d.toFixed(2)+'s"><circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="'+(r*2.3).toFixed(1)+'" fill="'+c+'" opacity=".45" filter="url(#'+f+')"/><circle cx="'+x.toFixed(1)+'" cy="'+y.toFixed(1)+'" r="'+r+'" fill="'+c+'"/></g>'}
  function star(x,y,r,fill){return '<path d="M'+x+' '+(y-r)+'L'+(x+r*.28)+' '+(y-r*.28)+'L'+(x+r)+' '+y+'L'+(x+r*.28)+' '+(y+r*.28)+'L'+x+' '+(y+r)+'L'+(x-r*.28)+' '+(y+r*.28)+'L'+(x-r)+' '+y+'L'+(x-r*.28)+' '+(y-r*.28)+'Z" fill="'+fill+'"/>'}
  const B=(t)=>[(1-t)*(1-t)*6+2*(1-t)*t*220+t*t*434,(1-t)*(1-t)*8+2*(1-t)*t*96+t*t*8];
  let h='';for(let k=0;k<22;k++){const p=B((k+.5)/22);h+=bulb(p[0],p[1]+4,2.6,LC[k%5],(k*.37)%2.2,'dglow')}
  document.getElementById('glights').innerHTML=h;
  h='';for(let k=0;k<13;k++){const y=130+k*38;h+=bulb(16,y,2.2,LC[k%5],(k*.53)%2.2,'dglow')+bulb(424,y,2.2,LC[(k+1)%5],(k*.53+.9)%2.2,'dglow')}
  [[52,150,7,0],[392,170,6,.8],[40,300,5,1.5],[404,330,8,.4],[60,450,6,1.1],[386,470,5,1.9],[110,118,4,.6],[330,124,5,1.3]].forEach(a=>{h+='<g class="spk" style="transform-origin:'+a[0]+'px '+a[1]+'px;animation-delay:'+a[3]+'s">'+star(a[0],a[1],a[2],'url(#dg)')+'</g>'});
  document.getElementById('slights').innerHTML=h;
  h='';[[40,30],[58,38],[32,52],[62,58],[46,66],[28,78],[70,80],[52,84],[38,84],[48,44]].forEach((q,k)=>{h+=bulb(q[0],q[1],2,LC[k%5],(k*.41)%2.2,'tglow')});
  document.getElementById('tlights').innerHTML=h;
})();

/* ---------- pine garland needles (generated) ---------- */
(function(){const g=document.getElementById('garl');if(!g)return;const C=['#0A3A28','#0E4A34','#135C40','#1C6B4C','#24805A'];let h='';const B=(t)=>[(1-t)*(1-t)*6+2*(1-t)*t*220+t*t*434,(1-t)*(1-t)*8+2*(1-t)*t*96+t*t*8];const gs=()=>{let u=0,v=0;while(!u)u=Math.random();while(!v)v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(6.283*v)};for(let i=0;i<900;i++){const t=Math.random(),p=B(t),x=p[0]+gs()*5,y=p[1]+gs()*5,a=Math.random()*6.283,L=5+Math.random()*6,dx=(Math.cos(a)*L).toFixed(1),dy=(Math.sin(a)*L).toFixed(1);h+='<path d="M'+x.toFixed(1)+' '+y.toFixed(1)+'l'+dx+' '+dy+'" stroke="'+C[i%5]+'"/>';if(Math.random()<.08)h+='<path d="M'+x.toFixed(1)+' '+y.toFixed(1)+'l'+dx+' '+dy+'" stroke="url(#dg)" stroke-width="1"/>'}g.innerHTML=h})();

/* ---------- fit card to the visible screen (KakaoTalk in-app browser safe) ---------- */
const Fit=(function(){
  const card=document.querySelector('.card'),stage=document.getElementById('stage');let S=1,TOP=12;
  function vh(){return Math.round((window.visualViewport&&window.visualViewport.height)||window.innerHeight)}
  function fit(){const W=innerWidth,H=vh();const top=Math.max(12,parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--sat'))||0)+ (W<700?58:64);
    const cm=document.getElementById('cameo'),tr=document.getElementById('tree'),ch=Math.max(cm?(cm.getBoundingClientRect().height||cm.offsetWidth*1.17):100,tr?tr.getBoundingClientRect().height:0);const reserve=Math.max(H*.14,ch*1.35);S=Math.min((W-24)/440,(H-reserve-top)/640,1.25);S=Math.max(S,.4);TOP=top;
    stage.style.top=top+'px';card.style.transform='scale('+S+')';document.documentElement.style.setProperty('--vh',H+'px')}
  addEventListener('resize',fit);window.visualViewport&&visualViewport.addEventListener('resize',fit);fit();addEventListener('load',fit);
  return {fit,vh};
})();

/* ---------- heavy snow that piles up in drifts ---------- */
(function(){
  const c=document.getElementById('snow'),x=c.getContext('2d');let W,H,dpr,P=[],B=[],G=[],L=[],M=[],COL=4;
  const card=document.querySelector('.card'),sign=document.querySelector('.sign');
  function size(){dpr=Math.min(2,window.devicePixelRatio||1);W=innerWidth;H=Fit.vh();c.width=W*dpr;c.height=H*dpr;c.style.height=H+'px';x.setTransform(dpr,0,0,dpr,0,0);
    const n=Math.ceil(W/COL)+2;const og=G;G=new Array(n).fill(0);if(og.length)for(let i=0;i<n;i++)G[i]=og[Math.min(og.length-1,Math.floor(i*og.length/n))];L=new Array(n).fill(0);
    const ph=Math.random()*6;M=new Array(n);for(let i=0;i<n;i++){const u=i*COL;M[i]=.55+.45*(.5+.5*Math.sin(u/57+ph))+.25*(.5+.5*Math.sin(u/23+ph*2.3))+.12*Math.sin(u/9+ph)}}
  size();addEventListener('resize',size);window.visualViewport&&visualViewport.addEventListener('resize',size);
  let OPEN=false;
  function flake(top){const z=Math.random();return OPEN?{x:Math.random()*W,y:top?-10-Math.random()*H*.3:Math.random()*H,z,r:1.2+z*z*6.4,v:.6+z*2.1,s:Math.random()*6.3,w:.4+Math.random()*.9}:{x:Math.random()*W,y:top?-10-Math.random()*H*.3:Math.random()*H,z,r:.5+z*1.5,v:.35+z*.9,s:Math.random()*6.3,w:.6+Math.random()*1.2}}
  const N=Math.round(Math.min(900,Math.max(360,W*H/700)));
  for(let i=0;i<N;i++)P.push(flake(false));
  for(let i=0;i<12;i++)B.push({x:Math.random()*W,y:Math.random()*H*.7,r:Math.random()*26+14,a:Math.random()*.1+.04,p:Math.random()*6,red:Math.random()<.25});
  function maxG(){if(!OPEN)return Math.min(H*.22,190);const r=sign.getBoundingClientRect(),ch=Math.max(document.getElementById('cameo').getBoundingClientRect().height,document.getElementById('tree').getBoundingClientRect().height);return Math.max(30,Math.min(H*.32,H-r.bottom-16,H-r.bottom-ch*.9))}
  function add(arr,i,amt,cap){for(let k=-2;k<=2;k++){const j=i+k;if(j<0||j>=arr.length)continue;const capj=arr===G?cap*(.78+.22*Math.min(1.3,M[j])):cap;arr[j]=Math.min(capj,arr[j]+amt*(k===0?1:k*k===1?.6:.25)*(arr===G?M[j]:1))}}
  let t0=performance.now(),RATE=2.5,SPEED=.5;function sync(){const r=document.getElementById('spd'),t=document.getElementById('spdv');if(r)r.value=LVL;if(t)t.textContent=LVL}
  const LV=[.3,.5,.8,1.3,2.1];let LVL=2;
  window.Snow={reset(){G.fill(0);L.fill(0);t0=performance.now();RATE=1;OPEN=true;for(const p of P)Object.assign(p,flake(false))},faster(){LVL=Math.min(5,LVL+1);SPEED=LV[LVL-1];sync()},set(v){LVL=v;SPEED=LV[v-1];sync()}};
  function f(t){x.clearRect(0,0,W,H);
    for(const b of B){const a=b.a*(.6+.4*Math.sin(t/1600+b.p));const gr=x.createRadialGradient(b.x,b.y,0,b.x,b.y,b.r);
      gr.addColorStop(0,b.red?`rgba(232,71,92,${a})`:`rgba(241,217,138,${a})`);gr.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=gr;x.beginPath();x.arc(b.x,b.y,b.r,0,7);x.fill()}
    const on=document.getElementById('stage').classList.contains('on');const R=on?card.getBoundingClientRect():null;const mg=maxG();
    const ledgeCap=R?Math.max(8,20*R.width/440):0;
    const wind=Math.sin(t/5200)*.6;
    for(const p of P){p.y+=p.v*SPEED;p.x+=Math.sin(t/900*p.w+p.s)*(.3+p.z*.5)+wind*p.z;
      if(p.x<-10)p.x=W+10;if(p.x>W+10)p.x=-10;
      const i=Math.max(0,Math.min(G.length-1,Math.round(p.x/COL)));
      if(OPEN&&R&&p.z>.35&&p.x>R.left+4&&p.x<R.right-4&&Math.abs(p.y-(R.top-L[i]))<p.v*SPEED+1&&Math.random()<.55){add(L,i,p.r*.30*RATE,ledgeCap);Object.assign(p,flake(true));continue}
      if(p.y>=H-G[i]){if(OPEN&&p.z>.2)add(G,i,p.r*1.2*RATE,mg);Object.assign(p,flake(true));continue}
      x.globalAlpha=OPEN?.6+p.z*.4:.35+p.z*.5;x.fillStyle=p.z<.22?'#F1D98A':'#FFFFFF';
      x.beginPath();x.arc(p.x,p.y,p.r,0,7);x.fill()}
    x.globalAlpha=1;
    for(let i=1;i<G.length-1;i++){G[i]=G[i]*.9+(G[i-1]+G[i+1])*.05;L[i]=L[i]*.86+(L[i-1]+L[i+1])*.07}
    const el=(t-t0)/1000;for(let i=0;i<G.length;i++)G[i]=Math.min(mg*(.78+.22*Math.min(1.3,M[i])),G[i]+(OPEN?.03*RATE*M[i]*Math.min(1,el/10):0));
    // cameo rides on the drift but never reaches the text
    for(const id of ['cameo','tree']){const cm=document.getElementById(id);if(!cm||!cm.classList.contains('up'))continue;const cr=cm.getBoundingClientRect();let sm=0,n=0;for(let i=Math.max(0,Math.round(cr.left/COL));i<=Math.min(G.length-1,Math.round(cr.right/COL));i++){sm+=G[i];n++}
      let lim=999;if(OPEN){const sr=sign.getBoundingClientRect();lim=H-sr.bottom-10-cr.height}cm.style.bottom=Math.max(-4,Math.min(lim,(n?sm/n:0)-12))+'px'}
    // ground drift
    const gr=x.createLinearGradient(0,H-mg-10,0,H);gr.addColorStop(0,'#FFFFFF');gr.addColorStop(1,'#D6E2E6');
    x.fillStyle=gr;x.beginPath();x.moveTo(0,H);for(let i=0;i<G.length;i++)x.lineTo(i*COL,H-G[i]);x.lineTo(W,H);x.closePath();
    x.shadowColor='rgba(255,255,255,.55)';x.shadowBlur=10;x.fill();x.shadowBlur=0;
    // soft shading on the drift
    x.fillStyle='rgba(180,200,210,.18)';x.beginPath();x.moveTo(0,H);for(let i=0;i<G.length;i++)x.lineTo(i*COL,H-G[i]*.55);x.lineTo(W,H);x.closePath();x.fill();
    // ledge on card top
    if(R){x.fillStyle='#FFFFFF';x.beginPath();const i0=Math.max(0,Math.round(R.left/COL)),i1=Math.min(L.length-1,Math.round(R.right/COL));
      x.moveTo(i0*COL,R.top+1);for(let i=i0;i<=i1;i++)x.lineTo(i*COL,R.top+1-L[i]);x.lineTo(i1*COL,R.top+1);x.closePath();x.fill()}
    requestAnimationFrame(f)}
  requestAnimationFrame(f);
})();

/* ---------- music box "Silent Night" (Franz Gruber, 1818 · public domain) ---------- */
/* rendered once in the page, then played through an <audio> element so it is heard
   inside the KakaoTalk browser even when an iPhone is set to silent mode */
const Music=(function(){
  const E8=.40,SR=22050;
  const m={C4:60,D4:62,E4:64,F4:65,G4:67,A4:69,B4:71,C5:72,D5:74,E5:76,F5:77};
  const mel=[['G4',3],['A4',1],['G4',2],['E4',6],['G4',3],['A4',1],['G4',2],['E4',6],['D5',4],['D5',2],['B4',6],['C5',4],['C5',2],['G4',6],
    ['A4',4],['A4',2],['C5',3],['B4',1],['A4',2],['G4',3],['A4',1],['G4',2],['E4',6],['A4',4],['A4',2],['C5',3],['B4',1],['A4',2],['G4',3],['A4',1],['G4',2],['E4',6],
    ['D5',4],['D5',2],['F5',3],['D5',1],['B4',2],['C5',6],['E5',6],['C5',3],['G4',1],['E4',2],['G4',3],['F4',1],['D4',2],['C4',12]];
  const ch=['C','C','C','C','G7','G7','C','C','F','F','C','C','F','F','C','C','G7','G7','C','C','C','G7','C','C'];
  const CH={C:[48,55,60,64],F:[41,53,57,60],G7:[43,55,59,65]};
  const hz=n=>440*Math.pow(2,(n-69)/12);
  const PASS=144*E8+1.6, LEN=PASS+3.2;
  const audio=new Audio();audio.loop=true;audio.preload='auto';audio.setAttribute('playsinline','');
  let want=false,ready=false,on=true;
  function wav(buf){const d=buf.getChannelData(0),n=d.length,b=new ArrayBuffer(44+n*2),v=new DataView(b);
    const w=(o,s)=>{for(let i=0;i<s.length;i++)v.setUint8(o+i,s.charCodeAt(i))};
    w(0,'RIFF');v.setUint32(4,36+n*2,true);w(8,'WAVE');w(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);
    v.setUint32(24,SR,true);v.setUint32(28,SR*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);w(36,'data');v.setUint32(40,n*2,true);
    let pk=0;for(let i=0;i<n;i++)pk=Math.max(pk,Math.abs(d[i]));const g=pk>0?.85/pk:1;
    for(let i=0;i<n;i++){let s=d[i]*g;s=s<-1?-1:s>1?1:s;v.setInt16(44+i*2,s*32767,true)}
    return new Blob([b],{type:'audio/wav'})}
  async function render(){
    const OAC=window.OfflineAudioContext||window.webkitOfflineAudioContext;if(!OAC)return;
    const ctx=new OAC(1,Math.ceil(SR*LEN),SR);
    const master=ctx.createGain();master.connect(ctx.destination);
    const dry=ctx.createGain();dry.gain.value=.8;dry.connect(master);
    const conv=ctx.createConvolver();const L=Math.floor(SR*2.0),ir=ctx.createBuffer(1,L,SR);const di=ir.getChannelData(0);
    for(let i=0;i<L;i++)di[i]=(Math.random()*2-1)*Math.pow(1-i/L,3.2);conv.buffer=ir;
    const wet=ctx.createGain();wet.gain.value=.5;wet.connect(conv);conv.connect(master);
    function bell(f,t,amp,dec){[[1,1,dec],[2,.35,dec*1.4],[3.01,.12,dec*2.3],[5.4,.16,dec*4]].forEach(([r,a,d])=>{
      if(f*r>SR/2-200)return;const o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=f*r;
      g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(amp*a,t+.005);g.gain.exponentialRampToValueAtTime(.0001,t+4.6/d);
      o.connect(g);g.connect(dry);g.connect(wet);o.start(t);o.stop(t+4.7/d)})}
    function pad(f,t,amp){const o=ctx.createOscillator(),g=ctx.createGain();o.type='triangle';o.frequency.value=f;
      g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(amp,t+.03);g.gain.exponentialRampToValueAtTime(.0001,t+3.6);
      o.connect(g);g.connect(dry);g.connect(wet);o.start(t);o.stop(t+3.7)}
    function pass(t0,tr){let t=t0;for(const [n,d] of mel){bell(hz(m[n]+tr),t,.16,2.2);t+=d*E8}
      ch.forEach((c,b)=>{const n=CH[c],i0=t0+b*6*E8;pad(hz(n[0]),i0,.07);[n[1],n[2],n[3],n[2],n[3],n[2]].forEach((nn,k)=>bell(hz(nn+tr),i0+k*E8,.045,2.8))})}
    pass(.2,0);
    const buf=await ctx.startRendering();
    audio.src=URL.createObjectURL(wav(buf));ready=true;if(want&&on)audio.play().catch(()=>{});
  }
  render().catch(()=>{});
  function start(){want=true;if(ready){audio.play().catch(()=>{})}else{audio.muted=true;audio.play().catch(()=>{});audio.pause();audio.muted=!on}}
  function toggle(){on=!on;audio.muted=!on;if(on&&audio.paused&&ready)audio.play().catch(()=>{});return on}
  document.addEventListener('visibilitychange',()=>{if(!want)return;if(document.hidden)audio.pause();else if(ready&&on)audio.play().catch(()=>{})});
  return {start,toggle,_a:audio};
})();

/* ---------- open ---------- */
const intro=document.getElementById('intro'),stage=document.getElementById('stage'),mute=document.getElementById('mute');
function open(){if(intro.classList.contains('gone'))return;intro.classList.add('gone');window.Snow&&Snow.reset();Music.start();
  setTimeout(()=>stage.classList.add('on'),500);mute.classList.add('show');document.getElementById('spdbox').classList.add('show');setTimeout(()=>document.getElementById('cameo').classList.add('up'),5200);setTimeout(()=>document.getElementById('tree').classList.add('up'),3600)}
intro.addEventListener('click',open);
const cameo=document.getElementById('cameo');cameo.addEventListener('click',()=>{window.Snow&&Snow.faster();cameo.classList.remove('hop');void cameo.offsetWidth;cameo.classList.add('hop')});
document.getElementById('spd').addEventListener('input',e=>window.Snow&&Snow.set(+e.target.value));
mute.addEventListener('click',()=>{const on=Music.toggle();document.getElementById('icOn').style.display=on?'':'none';document.getElementById('icOff').style.display=on?'none':''});
if(new URLSearchParams(location.search).has('open')){intro.classList.add('gone');window.Snow&&Snow.reset();document.getElementById('spdbox').classList.add('show');stage.classList.add('on');document.getElementById('cameo').classList.add('up');document.getElementById('tree').classList.add('up')}
</script>
</body>
</html>
